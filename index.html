<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>J.A.R.V.I.S. | CEO</title>
<style>
  :root {
    --bg: #000000; --panel: rgba(6, 15, 30, 0.95); --border: #1a365d; 
    --cyan: #00f3ff; --gold: #ffd700; --red: #ff2a2a; --text: #e2e8f0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }
  body { background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  
  /* DASHBOARD (WORK MODE) */
  #dashboard-ui { display: none; flex-direction: column; height: 100vh; height: 100dvh; z-index: 10; position: relative; padding: 10px; overflow-y: auto; padding-bottom: 120px; }
  #dashboard-ui.active { display: flex; }
  
  .top-bar { display: flex; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 10px; color: var(--cyan); background: rgba(10,22,40,0.8); margin-bottom: 10px; }

  /* GRAPHICAL BALANCE OVERVIEW */
  .graphic-overview { display: flex; align-items: center; justify-content: space-around; background: var(--panel); border: 1px solid var(--border); padding: 15px; border-radius: 8px; margin-bottom: 10px; }
  .ring-container { position: relative; width: 80px; height: 80px; }
  .ring { width: 100%; height: 100%; border-radius: 50%; border: 6px solid rgba(0,243,255,0.1); border-top: 6px solid var(--cyan); transform: rotate(45deg); transition: all 1s ease; }
  .ring-inner { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: var(--gold); }
  .graphic-text h2 { color: var(--cyan); font-size: 12px; margin-bottom: 5px; }
  .graphic-text p { font-size: 10px; color: #94a3b8; }

  /* KPI CARDS */
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .kpi-box { background: var(--panel); border: 1px solid var(--border); padding: 8px; font-size: 9px; color: #94a3b8; border-left: 3px solid var(--cyan); cursor: pointer; transition: all 0.2s; position: relative; }
  .kpi-box:active { border-color: var(--gold); }
  .kpi-box span { display: block; font-size: 13px; color: var(--gold); font-weight: bold; margin-top: 4px; }
  .kpi-box::after { content: '✎'; position: absolute; top: 4px; right: 6px; font-size: 9px; opacity: 0.5; }

  /* ASSOCIATES */
  .associates { background: var(--panel); border: 1px solid var(--border); padding: 10px; border-radius: 6px; margin-bottom: 10px; }
  .associates h3 { color: var(--cyan); font-size: 10px; margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .bot-list { display: flex; gap: 10px; flex-wrap: wrap; }
  .bot-tag { background: rgba(0,243,255,0.1); border: 1px solid var(--cyan); color: var(--cyan); padding: 4px 8px; border-radius: 4px; font-size: 10px; }

  /* 3D ORB */
  #orb-container { position: fixed; bottom: 30px; width: 100%; display: flex; justify-content: center; align-items: center; z-index: 100; pointer-events: none; }
  .orb-wrapper { position: relative; width: 100px; height: 100px; pointer-events: auto; cursor: pointer; transition: transform 0.1s; }
  .orb-core { position: absolute; top: 10%; left: 10%; width: 80%; height: 80%; background: radial-gradient(circle at 30% 30%, #ffffff, var(--cyan) 30%, #003366 80%); border-radius: 50%; box-shadow: 0 0 30px var(--cyan), inset 0 0 20px var(--cyan); animation: corePulse 3s infinite alternate; }
  .orb-ring { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 2px solid transparent; border-top-color: var(--cyan); border-radius: 50%; animation: spin 4s linear infinite;.orb-ring:nth-child(2) { top: 5%; left: 5%; width: 90%; height: 90%; border-top-color: transparent; border-bottom-color: var(--cyan); animation: spinReverse 6s linear infinite; }
  .orb-ring:nth-child(3) { top: -5%; left: -5%; width: 110%; height: 110%; border: 1px dashed var(--cyan); opacity: 0.3; animation: spin 10s linear infinite; }
  .orb-glass { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 70% 30%, rgba(255,255,255,0.2) 0%, transparent 40%); box-shadow: inset 0 0 20px rgba(255,255,255,0.1); }

  @keyframes spin { 100% { transform: rotate(360deg); } }
  @keyframes spinReverse { 100% { transform: rotate(-360deg); } }
  @keyframes corePulse { 0% { transform: scale(0.95); opacity: 0.8; } 100% { transform: scale(1.05); opacity: 1; } }

  /* TEXT INPUT */
  #text-input-area { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: var(--panel); border-top: 1px solid var(--cyan); padding: 15px; z-index: 9999; flex-direction: column; gap: 10px;}
  #text-input-area.active { display: flex; }
  .text-row { display: flex; gap: 10px; width: 100%; }
  #text-input-area input { flex: 1; background: #000; border: 1px solid var(--border); color: var(--gold); padding: 12px; font-family: 'Courier New'; font-size: 14px; outline: none; border-radius: 4px;}
  #text-input-area button { background: var(--cyan); border: none; color: #000; padding: 0 20px; font-weight: bold; cursor: pointer; border-radius: 4px; }
  #voice-select { width: 100%; background: #000; color: var(--cyan); border: 1px solid var(--border); padding: 8px; font-family: 'Courier New'; margin-bottom: 5px; }

  /* CHAT LOG */
  #chat-log { position: fixed; bottom: 140px; width: 90%; left: 5%; max-height: 30vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; pointer-events: none; z-index: 90; align-items: center; }
  .msg { padding: 6px 12px; border-radius: 6px; font-size: 12px; background: rgba(6,15,30,0.9); border: 1px solid var(--border); color: var(--text); text-align: center; }
  .msg.jarvis { color: var(--gold); border-color: var(--gold); }

  #keyboard-btn { position: fixed; bottom: 40px; right: 20px; z-index: 150; background: rgba(6, 15, 30, 0.8); border: 1px solid var(--cyan); color: var(--cyan); padding: 15px; border-radius: 50%; cursor: pointer; font-size: 20px; }
</style>
</head>
<body>

<div id="dashboard-ui">
  <div class="top-bar">
    <div>JARVIS ONLINE</div>
    <div id="clock">00:00</div>
  </div>
  <div class="graphic-overview">
    <div class="ring-container">
      <div class="ring" id="visual-ring"></div>
      <div class="ring-inner" id="visual-percent">0%</div>
    </div>
    <div class="graphic-text">
      <h2>FINANCIAL HEALTH</h2>
      <p>Balance left: <strong id="visual-balance" style="color:var(--gold); font-size:14px;">$0</strong></p>
    </div>
  </div>
  <div class="kpi-grid">
    <div class="kpi-box" onclick="editKPI('income')">INCOME <span id="ui-income">$0</span></div>
    <div class="kpi-box" onclick="editKPI('expenses')">EXPENSES <span id="ui-expenses">$0</span></div>
    <div class="kpi-box" onclick="editKPI('savings')">SAVINGS <span id="ui-savings">$0</span></div>
    <div class="kpi-box" onclick="editKPI('bills')">BILLS <span id="ui-bills">$0</span></div>
    <div class="kpi-box" onclick="editKPI('account')">ACCOUNT <span id="ui-account">$0</span></div>
    <div class="kpi-box" onclick="editKPI('budget')">BUDGET <span id="ui-budget">$0</span></div>
    <div class="kpi-box" onclick="editKPI('investments')">INVESTMENTS <span id="ui-investments">$0</span></div>
    <div class="kpi-box" onclick="editKPI('balanceLeft')">BALANCE LEFT <span id="ui-balanceLeft">$0</span></div>
  </div>
  <div class="associates">
    <h3>ASSOCIATES HUB</h3><div class="bot-list">
      <div class="bot-tag">🟢 Jack of All Trades</div>
      <div class="bot-tag">🟢 Trading Bot</div>
    </div>
  </div>
  <button onclick="toggleWorkMode(true)" style="margin-top:20px; padding:10px; background:var(--cyan); color:#000; font-weight:bold; border:none; border-radius:5px; cursor:pointer;">MANUAL WORK MODE</button>
</div>

<div id="chat-log"></div>
<button id="keyboard-btn" onclick="toggleKeyboard()">⌨</button>

<div id="text-input-area">
  <select id="voice-select" onchange="changeVoice()"></select>
  <div class="text-row">
    <input type="text" id="text-command" placeholder="Type command..." onkeypress="handleTextInput(event)">
    <button onclick="submitTextCommand()">SEND</button>
  </div>
</div>

<div id="orb-container">
  <div class="orb-wrapper" onclick="manualActivate()">
    <div class="orb-ring"></div>
    <div class="orb-ring"></div>
    <div class="orb-ring"></div>
    <div class="orb-core" id="orb-core"></div>
    <div class="orb-glass"></div>
  </div>
</div>

<script>
// ==========================================
// 1. FINANCES
// ==========================================
let finances = JSON.parse(localStorage.getItem("jarvis_finances")) || {
  income: 0, expenses: 0, bills: 0, savings: 0, account: 0, budget: 0, investments: 0, balanceLeft: 0
};

function updateKPIUI() {
  document.getElementById("ui-income").innerText = "$" + finances.income.toLocaleString();
  document.getElementById("ui-expenses").innerText = "$" + finances.expenses.toLocaleString();
  document.getElementById("ui-savings").innerText = "$" + finances.savings.toLocaleString();
  document.getElementById("ui-bills").innerText = "$" + finances.bills.toLocaleString();
  document.getElementById("ui-account").innerText = "$" + finances.account.toLocaleString();
  document.getElementById("ui-budget").innerText = "$" + finances.budget.toLocaleString();
  document.getElementById("ui-investments").innerText = "$" + finances.investments.toLocaleString();
  document.getElementById("ui-balanceLeft").innerText = "$" + finances.balanceLeft.toLocaleString();
  document.getElementById("visual-balance").innerText = "$" + finances.balanceLeft.toLocaleString();

  let percentUsed = 0;
  if (finances.budget > 0) percentUsed = Math.min((finances.expenses / finances.budget) * 100, 100);
  document.getElementById("visual-percent").innerText = Math.round(percentUsed) + "%";
  
  let ring = document.getElementById("visual-ring");
  if (percentUsed > 85) ring.style.borderTopColor = "var(--red)";
  else ring.style.borderTopColor = "var(--cyan)";
}

function editKPI(type) {
  let newVal = prompt(Enter new amount for ${type.toUpperCase()}:, finances[type]);
  if (newVal !== null && !isNaN(newVal) && newVal !== "") {
    finances[type] = parseFloat(newVal);
    localStorage.setItem("jarvis_finances", JSON.stringify(finances));
    updateKPIUI();
  }
}
updateKPIUI();

// ==========================================
// 2. NAME RANDOMIZER (Fixed Mkuu)
// ==========================================
const names = [
  { text: "Bwana", speak: "Bwana" },
  { text: "Chief", speak: "Chief" },
  { text: "Mkuu", speak: "Mkoo" }, 
  { text: "Boss", speak: "Boss" },
  { text: "Sir", speak: "Sir" },
  { text: "Jorim", speak: "Jorim" }
];

function getRandomName(forSpeaking = false) {
  const n = names[Math.floor(Math.random() * names.length)];
  return forSpeaking ? n.speak : n.text;
}

// ==========================================
// 3. VOICE ENGINE
// ==========================================
let synth = window.speechSynthesis;
let selectedVoice = null;
let voices = [];

function loadVoices() {
  voices = synth.getVoices();
  const select = document.getElementById("voice-select");
  select.innerHTML = "";
  
  let bestVoices = voices.filter(v => v.lang.includes("en"));
  let maleFound = false;if (cmd.includes("work")  cmd.includes("dashboard")  cmd.includes("open") || t.includes("work mode")) {
        toggleWorkMode(true);
        say(Work mode activated, ${getRandomName(true)}.);
      } else if (cmd.includes("exit")  cmd.includes("close")  cmd.includes("stop")) {
        toggleWorkMode(false);
        say(Closing dashboard, ${getRandomName(true)}.);
      } else if (cmd) {
        addMsg("Jorim: " + t, "user");
        handleCommand(cmd);
      } else {
        say(Yes, ${getRandomName(true)}?);
      }
    }
  };
}

function manualActivate() {
  setupMic();
  if (rec) {
    rec.shouldBeListening = true;
    try { rec.start(); } catch(e) {}
  }
  say(Yes, ${getRandomName(true)}?);
}

function toggleWorkMode(active) {
  if (active) { dashboard.classList.add("active"); } 
  else { dashboard.classList.remove("active"); }
}

function addMsg(text, sender) {
  const div = document.createElement("div");
  div.className = "msg " + sender;
  div.innerText = text;
  document.getElementById("chat-log").appendChild(div);
}

document.body.addEventListener('click', () => {
  setupMic();
  if (rec && !rec.isStarted) {
    rec.shouldBeListening = true;
    try { rec.start(); rec.isStarted = true; } catch(e) {}
  }
}, { once: true });

setInterval(() => { document.getElementById("clock").innerText = new Date().toLocaleTimeString(); }, 1000);

async function handleCommand(cmd) {
  if (cmd.includes("investment")) { finances.investments += 100; updateKPIUI(); return say(Investment updated, ${getRandomName(true)}.); }
  if (cmd.includes("income")) { finances.income += 100; updateKPIUI(); return say(Income updated, ${getRandomName(true)}.); }
  if (cmd.includes("expense")) { finances.expenses += 100; updateKPIUI(); return say(Expenses updated, ${getRandomName(true)}.); }
  setTimeout(() => { say(Processing: ${cmd}); }, 500);
}
</script>
</body>
</html>
